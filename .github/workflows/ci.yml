name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cortex-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff default rules)
        run: ruff check cortex tests --select E4,E7,E9,F

      - name: Offline test gate (unit + integration)
        run: pytest -m "unit or integration" -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cortex-app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortex-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc project references)
        run: npx tsc -b

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Production build
        run: npm run build
