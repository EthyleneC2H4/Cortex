# 依赖更新：三生态各一；周更 pip（安全面），月更 npm/docker（变更面收敛）
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/cortex-app"
    schedule:
      interval: "weekly"
    # hello-agents 锁死 1.0.0（框架契约），不自动升
    ignore:
      - dependency-name: "hello-agents"

  - package-ecosystem: "npm"
    directory: "/cortex-app/frontend"
    schedule:
      interval: "monthly"
    groups:
      dev-deps:
        dependency-type: "development"

  - package-ecosystem: "docker"
    directory: "/cortex-app"
    schedule:
      interval: "monthly"
