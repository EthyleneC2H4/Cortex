[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "1.0.0"
description = "Multi-agent personal knowledge management & research assistant built on hello-agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["rag", "multi-agent", "knowledge-management", "llm", "hello-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]

dependencies = [
  "hello-agents==1.0.0",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "qdrant-client>=1.9",
  "networkx>=3.0",
  "markitdown>=0.1.1,<0.2",  # 0.x 系列 API 不稳定，上界防意外破坏解析链路
  "sentence-transformers>=2.7",
  "rank-bm25>=0.2.2",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "sse-starlette>=1.8",
  "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/EthyleneC2H4/Cortex"
Documentation = "https://github.com/EthyleneC2H4/Cortex/tree/main/docs"
Issues = "https://github.com/EthyleneC2H4/Cortex/issues"

[project.scripts]
cortex = "cortex.app:main"
cortex-eval = "cortex.eval.runner:main"

[project.optional-dependencies]
rerank = ["FlagEmbedding>=1.2"]
docker = ["neo4j>=5.0"]
mcp = ["mcp>=1.29,<2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --tb=short"
markers = [
  "unit: pure-offline, all externals mocked",
  "integration: local stores / real deps, no live LLM unless HAS_LLM_KEY",
  "e2e: live LLM required (HAS_LLM_KEY)",
]

[tool.ruff]
line-length = 110
