# 仅 CORTEX_STORE_MODE=docker 时需要；local 模式零 docker 即可开发测试。
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0  # 固定 tag：latest 漂移会使存储格式/行为不可复现
    ports: ["6333:6333", "6334:6334"]
    volumes: ["./data/qdrant:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      retries: 6

  neo4j:
    image: neo4j:5.26.30
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/cortex-dev-pw
    volumes: ["./data/neo4j:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 6
